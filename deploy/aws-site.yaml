AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  MultiCorder - site estático. Um bucket S3 privado guarda os arquivos e o CloudFront entrega
  com HTTPS (necessário para câmera, microfone e armazenamento no navegador), compressão e cache.

# Plano de preço fixo: a distribuição é compatível com o plano Free do CloudFront (US$ 0/mês,
# sem cobrança de excedente, com WAF). O plano é ligado pelo console e cria o WAF; o ARN dele
# entra aqui no parâmetro WebAclArn, para uma atualização da stack não tirar o WAF.
#
# Como usar: veja docs/PUBLICAR-AWS.md. Resumo (os valores vêm da sua conta; não ficam no repositório):
#   aws cloudformation deploy --stack-name multicorder --template-file deploy/aws-site.yaml
#     --region sa-east-1 --parameter-overrides WebAclArn=arn:aws:wafv2:... DomainName=seudominio.com.br
#     CertificateArn=arn:aws:acm:us-east-1:...
#   powershell -File deploy/publicar-aws.ps1

Parameters:
  DomainName:
    Type: String
    Default: ''
    Description: >-
      (Opcional) Domínio próprio, ex.: seudominio.com.br. Com ele preenchido, a stack cria a zona
      DNS no Route 53 (os servidores DNS saem em NameServers, para pôr no Registro.br). Com o
      certificado (CertificateArn) também, o domínio passa a abrir o site. Vazio = só o endereço
      *.cloudfront.net.
  CertificateArn:
    Type: String
    Default: ''
    Description: >-
      (Opcional, junto com DomainName) ARN do certificado do ACM para o domínio. Precisa ter sido
      criado na região us-east-1 (Norte da Virgínia), que é a que o CloudFront usa.
  WebAclArn:
    Type: String
    Default: ''
    Description: >-
      (Opcional) ARN do Web ACL do AWS WAF ligado à distribuição. Obrigatório depois de ativar o
      plano de preço fixo: sem ele, a atualização da stack tiraria o WAF.
  PriceClass:
    Type: String
    Default: PriceClass_All
    AllowedValues: [PriceClass_100, PriceClass_200, PriceClass_All]
    Description: >-
      Onde ficam as cópias do site. PriceClass_All inclui a América do Sul (mais rápido no Brasil);
      PriceClass_100 só EUA, Canadá e Europa.

Conditions:
  HasZone: !Not [!Equals [!Ref DomainName, '']]
  HasDomain: !And
    - !Not [!Equals [!Ref DomainName, '']]
    - !Not [!Equals [!Ref CertificateArn, '']]
  HasWaf: !Not [!Equals [!Ref WebAclArn, '']]

Resources:
  # Bucket privado: ninguém acessa direto pela internet; só o CloudFront (pela política abaixo).
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  # Identidade do CloudFront para ler o bucket (o jeito atual e recomendado: OAC).
  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-oac'
        Description: CloudFront lê o bucket do MultiCorder
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # Cache e cabeçalhos: usam as regras PRONTAS da AWS (o plano de preço fixo Free do CloudFront
  # não aceita regras próprias). Elas estão na distribuição, abaixo:
  # - CachingOptimized: segue o Cache-Control/s-maxage que o script grava em cada arquivo e
  #   comprime com gzip e brotli;
  # - SecurityHeadersPolicy: HTTPS obrigatório (HSTS), nosniff, proteção contra o site ser
  #   embutido em outro (frame options) e política de referência.

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: MultiCorder
        DefaultRootObject: index.html
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: !Ref PriceClass
        WebACLId: !If [HasWaf, !Ref WebAclArn, !Ref AWS::NoValue]
        Aliases: !If [HasDomain, [!Ref DomainName], !Ref AWS::NoValue]
        ViewerCertificate: !If
          - HasDomain
          - AcmCertificateArn: !Ref CertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true
        Origins:
          - Id: s3site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: s3site
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          Compress: true
          # Managed-CachingOptimized e Managed-SecurityHeadersPolicy (IDs fixos da AWS)
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03

  # Só esta distribuição do CloudFront pode ler os arquivos do bucket.
  BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: SomenteCloudFront
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${SiteBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}'

  # Zona DNS do domínio no Route 53 (o plano de preço fixo inclui a zona e as consultas).
  HostedZone:
    Type: AWS::Route53::HostedZone
    Condition: HasZone
    Properties:
      Name: !Ref DomainName
      HostedZoneConfig:
        Comment: Multicorder - VideoMusic Maker

  # O domínio aponta para o CloudFront (IPv4 e IPv6). Z2FDTNDATAQYW2 é a zona fixa do CloudFront.
  SiteRecordA:
    Type: AWS::Route53::RecordSet
    Condition: HasDomain
    Properties:
      HostedZoneId: !Ref HostedZone
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
  SiteRecordAAAA:
    Type: AWS::Route53::RecordSet
    Condition: HasDomain
    Properties:
      HostedZoneId: !Ref HostedZone
      Name: !Ref DomainName
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2

Outputs:
  BucketName:
    Description: Bucket com os arquivos do site
    Value: !Ref SiteBucket
  DistributionId:
    Description: Distribuição do CloudFront (usada para limpar o cache a cada publicação)
    Value: !Ref Distribution
  SiteUrl:
    Description: Endereço do MultiCorder
    Value: !If [HasDomain, !Sub 'https://${DomainName}', !Sub 'https://${Distribution.DomainName}']
  CloudFrontDomain:
    Description: Domínio do CloudFront
    Value: !GetAtt Distribution.DomainName
  HostedZoneId:
    Condition: HasZone
    Description: Zona DNS do domínio no Route 53
    Value: !Ref HostedZone
  NameServers:
    Condition: HasZone
    Description: Servidores DNS para colocar no Registro.br
    Value: !Join [', ', !GetAtt HostedZone.NameServers]
